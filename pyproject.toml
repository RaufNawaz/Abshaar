[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abshaar"
version = "0.1.0"
description = "Local-first archive and AI-assisted translation infrastructure for South Asian mystical poetry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Rauf Nawaz" }
]
dependencies = []

[project.optional-dependencies]
pdf = [
  "pypdf>=5.0.0"
]
ai = [
  "ollama>=0.3.0",
  "sentence-transformers>=3.0.0",
  "chromadb>=0.5.0",
  "transformers>=4.45.0",
  "torch>=2.3.0"
]
dev = [
  "ruff>=0.6.0"
]

[project.scripts]
abshaar = "abshaar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
